<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <title>Redefinição de Senha | SaudeBras</title>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #00ae9d;
            --primary-hover: #009688;
            --primary-light: #e0f7f5;
            --secondary-color: #f8f9fa;
            --text-dark: #2c3e50;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --shadow-light: 0 2px 10px rgba(0, 174, 157, 0.08);
            --shadow-medium: 0 8px 30px rgba(0, 174, 157, 0.12);
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 1rem;
        }

        /* Elementos decorativos de fundo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 174, 157, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .reset-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        .reset-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-medium);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }

        .reset-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-hover));
        }

        .reset-header {
            text-align: center;
            padding: 3rem 2rem 1rem;
            position: relative;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.1));
            transition: var(--transition);
        }

        .logo:hover {
            transform: translateY(-2px);
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.15));
        }

        .reset-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .reset-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.5;
            max-width: 380px;
            margin: 0 auto;
        }

        .reset-form {
            padding: 1.5rem 2rem 3rem;
        }

        .form-group {
            margin-bottom: 2rem;
            position: relative;
        }

        .form-label {
            display: block;
            color: var(--text-dark);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            transition: var(--transition);
        }

        .password-field {
            position: relative;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            align-items: center;
        }

        .password-field:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 174, 157, 0.1);
            transform: translateY(-1px);
        }

        .password-field.valid {
            border-color: var(--success-color);
        }

        .password-field.invalid {
            border-color: var(--error-color);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 20%, 40%, 60%, 80% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-3px); }
        }

        .form-control {
            flex: 1;
            padding: 1rem 1rem;
            border: none;
            outline: none;
            font-size: 1rem;
            font-weight: 400;
            background: transparent;
            color: var(--text-dark);
        }

        .form-control::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .toggle-password {
            padding: 1rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin-right: 0.25rem;
        }

        .toggle-password:hover {
            color: var(--primary-color);
            background: var(--primary-light);
        }

        .password-requirements {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--secondary-color);
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .requirement:last-child {
            margin-bottom: 0;
        }

        .requirement.valid {
            color: var(--success-color);
        }

        .requirement-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: var(--transition);
        }

        .requirement.valid .requirement-icon {
            background: var(--success-color);
            border-color: var(--success-color);
            color: #fff;
        }

        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .error-message.show {
            display: flex;
            animation: fadeInUp 0.3s ease-out;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: fadeInUp 0.3s ease-out;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: #fff;
            border: none;
            padding: 1.25rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 174, 157, 0.3);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .submit-btn.loading {
            pointer-events: none;
        }

        .submit-btn.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            margin: auto;
            border: 2px solid white;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
            padding: 0.5rem;
            border-radius: 8px;
            margin: 0 auto;
            justify-content: center;
            text-align: center;
        }

        .back-link:hover {
            color: var(--primary-hover);
            background: var(--primary-light);
            text-decoration: none;
            transform: translateX(-2px);
        }

        /* Animações */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reset-card {
            animation: fadeInUp 0.6s ease-out;
        }

        /* Responsivo */
        @media (max-width: 576px) {
            .reset-container {
                margin: 0.5rem;
            }
            
            .reset-header {
                padding: 2rem 1.5rem 1rem;
            }
            
            .reset-form {
                padding: 1rem 1.5rem 2.5rem;
            }
            
            .logo {
                max-width: 160px;
            }
            
            .reset-title {
                font-size: 1.5rem;
            }
        }

        /* Validação em tempo real */
        .strength-meter {
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .strength-meter-fill {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: var(--transition);
        }

        .strength-weak { background: var(--error-color); }
        .strength-medium { background: var(--warning-color); }
        .strength-strong { background: var(--success-color); }
    </style>
</head>

<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="reset-header">
                <img src="/static/img/saudebras-logo.png" alt="SaudeBras" class="logo">
                <h1 class="reset-title">
                    <i class="bi bi-shield-lock"></i>
                    Criar Nova Senha
                </h1>
                <p class="reset-subtitle">
                    Digite sua nova senha com pelo menos 8 caracteres, incluindo pelo menos 1 maiúsculo, 1 minúsculo e 1 número
                </p>
            </div>

            <form class="reset-form" method="post" id="passwordResetForm">
                {% csrf_token %}
                
                <div id="error-message" class="error-message">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span id="error-text"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_new_password1">
                        <i class="bi bi-key"></i>
                        Nova Senha
                    </label>
                    <div class="password-field" id="password1-field">
                        <input 
                            type="password" 
                            name="new_password1" 
                            id="id_new_password1" 
                            class="form-control" 
                            placeholder="Digite sua nova senha"
                            autocomplete="new-password" 
                            required
                        >
                        <span class="toggle-password" onclick="togglePasswordVisibility('id_new_password1', 'eye-icon1')">
                            <i id="eye-icon1" class="bi bi-eye-slash"></i>
                        </span>
                    </div>
                    <div class="strength-meter">
                        <div class="strength-meter-fill" id="strength-fill"></div>
                    </div>
                </div>

                <div class="password-requirements">
                    <div class="requirement" id="req-length">
                        <span class="requirement-icon">
                            <i class="bi bi-check"></i>
                        </span>
                        <span>Pelo menos 8 caracteres</span>
                    </div>
                    <div class="requirement" id="req-uppercase">
                        <span class="requirement-icon">
                            <i class="bi bi-check"></i>
                        </span>
                        <span>Uma letra maiúscula</span>
                    </div>
                    <div class="requirement" id="req-lowercase">
                        <span class="requirement-icon">
                            <i class="bi bi-check"></i>
                        </span>
                        <span>Uma letra minúscula</span>
                    </div>
                    <div class="requirement" id="req-number">
                        <span class="requirement-icon">
                            <i class="bi bi-check"></i>
                        </span>
                        <span>Um número</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_new_password2">
                        <i class="bi bi-shield-check"></i>
                        Confirmar Senha
                    </label>
                    <div class="password-field" id="password2-field">
                        <input 
                            type="password" 
                            name="new_password2" 
                            id="id_new_password2" 
                            class="form-control" 
                            placeholder="Confirme sua nova senha"
                            autocomplete="new-password" 
                            required
                        >
                        <span class="toggle-password" onclick="togglePasswordVisibility('id_new_password2', 'eye-icon2')">
                            <i id="eye-icon2" class="bi bi-eye-slash"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="bi bi-check-circle"></i>
                    <span>Redefinir Senha</span>
                </button>

                <div style="text-align: center;">
                    <a href="javascript:history.back()" class="back-link">
                        <i class="bi bi-arrow-left"></i>
                        Voltar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Variáveis globais
        const password1 = document.getElementById('id_new_password1');
        const password2 = document.getElementById('id_new_password2');
        const password1Field = document.getElementById('password1-field');
        const password2Field = document.getElementById('password2-field');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const strengthFill = document.getElementById('strength-fill');
        const form = document.getElementById('passwordResetForm');
        const submitBtn = document.getElementById('submitBtn');

        // Toggle de visibilidade da senha
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.classList.remove('bi-eye-slash');
                eyeIcon.classList.add('bi-eye');
            } else {
                passwordInput.type = "password";
                eyeIcon.classList.remove('bi-eye');
                eyeIcon.classList.add('bi-eye-slash');
            }
        }

        // Validação de requisitos da senha
        function checkPasswordRequirements(password) {
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /\d/.test(password)
            };

            // Atualizar visual dos requisitos
            Object.keys(requirements).forEach(req => {
                const element = document.getElementById(`req-${req}`);
                if (requirements[req]) {
                    element.classList.add('valid');
                } else {
                    element.classList.remove('valid');
                }
            });

            return requirements;
        }

        // Calcular força da senha
        function calculatePasswordStrength(password) {
            const requirements = checkPasswordRequirements(password);
            const validCount = Object.values(requirements).filter(Boolean).length;
            
            let strength = 0;
            let className = '';

            if (validCount >= 4) {
                strength = 100;
                className = 'strength-strong';
            } else if (validCount >= 2) {
                strength = 60;
                className = 'strength-medium';
            } else if (validCount >= 1) {
                strength = 30;
                className = 'strength-weak';
            }

            // Atualizar medidor de força
            strengthFill.style.width = strength + '%';
            strengthFill.className = 'strength-meter-fill ' + className;

            return validCount === 4;
        }

        // Mostrar erro
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
        }

        // Esconder erro
        function hideError() {
            errorMessage.classList.remove('show');
        }

        // Validar senhas em tempo real
        password1.addEventListener('input', function() {
            const isValid = calculatePasswordStrength(this.value);
            
            if (this.value.length > 0) {
                if (isValid) {
                    password1Field.classList.add('valid');
                    password1Field.classList.remove('invalid');
                } else {
                    password1Field.classList.remove('valid');
                    password1Field.classList.add('invalid');
                }
            } else {
                password1Field.classList.remove('valid', 'invalid');
            }

            // Revalidar confirmação se já foi preenchida
            if (password2.value.length > 0) {
                validatePasswordConfirmation();
            }

            hideError();
        });

        // Validar confirmação de senha
        function validatePasswordConfirmation() {
            if (password2.value === password1.value && password2.value.length > 0) {
                password2Field.classList.add('valid');
                password2Field.classList.remove('invalid');
                return true;
            } else if (password2.value.length > 0) {
                password2Field.classList.add('invalid');
                password2Field.classList.remove('valid');
                return false;
            } else {
                password2Field.classList.remove('valid', 'invalid');
                return false;
            }
        }

        password2.addEventListener('input', function() {
            validatePasswordConfirmation();
            hideError();
        });

        // Validação do formulário
        form.addEventListener('submit', function(e) {
            const password1Value = password1.value;
            const password2Value = password2.value;
            
            // Verificar se as senhas coincidem
            if (password1Value !== password2Value) {
                e.preventDefault();
                showError('As senhas não coincidem.');
                password2Field.classList.add('invalid');
                return;
            }

            // Verificar requisitos da senha
            const isPasswordValid = calculatePasswordStrength(password1Value);
            if (!isPasswordValid) {
                e.preventDefault();
                showError('A senha não atende aos requisitos mínimos.');
                password1Field.classList.add('invalid');
                return;
            }

            // Se chegou até aqui, o formulário é válido
            hideError();
            
            // Adicionar estado de loading
            submitBtn.classList.add('loading');
            submitBtn.querySelector('span').textContent = 'Redefinindo...';
        });

        // Efeitos visuais adicionais
        document.addEventListener('DOMContentLoaded', function() {
            // Animação da logo
            const logo = document.querySelector('.logo');
            logo.addEventListener('mouseover', function() {
                this.style.transform = 'rotate(3deg) scale(1.05)';
            });

            logo.addEventListener('mouseout', function() {
                this.style.transform = 'rotate(0deg) scale(1)';
            });

            // Efeito parallax suave
            document.addEventListener('mousemove', function(e) {
                const card = document.querySelector('.reset-card');
                const x = (e.clientX / window.innerWidth) * 5;
                const y = (e.clientY / window.innerHeight) * 5;
                card.style.transform = `rotateY(${x / 10}deg) rotateX(${-y / 10}deg)`;
            });

            // Focus automático no primeiro campo
            password1.focus();
        });
    </script>
</body>
</html>
